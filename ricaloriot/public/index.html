<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricaloriot</title>
<meta name="description" content="כמה נשאר לאכול היום — קלוריות וחלבון, משותף בזמן אמת.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EFF8F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1811" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ricaloriot">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/api/manifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="gate" hidden>
  <form class="gate-card" data-form="gate" novalidate>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="12" fill="none" stroke="var(--kcal)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="54 76" transform="rotate(-90 16 16)"/>
      <circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--protein)" stroke-width="4" stroke-linecap="round" stroke-dasharray="22 35" transform="rotate(-90 16 16)"/>
    </svg>
    <h1 dir="ltr">Ricaloriot</h1>
    <p>כמה נשאר לאכול היום</p>
    <label class="field code-field"><span>קוד כניסה</span>
      <input id="gate-code" dir="ltr" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="••••••"></label>
    <p class="gate-err" id="gate-err" role="alert"></p>
    <button type="submit" class="btn primary big">כניסה</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand" dir="ltr">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="var(--kcal)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="54 76" transform="rotate(-90 16 16)"/>
        <circle cx="16" cy="16" r="5.5" fill="none" stroke="var(--protein)" stroke-width="4" stroke-linecap="round" stroke-dasharray="22 35" transform="rotate(-90 16 16)"/>
      </svg>
      <span>Ricaloriot</span>
    </div>
    <div class="top-side">
      <span id="sync" class="sync" data-s="idle"><i></i><span></span></span>
      <button type="button" class="icon-btn" data-act="settings" aria-label="יעד והגדרות">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>
  <div id="cart"></div>

  <nav class="tabs" aria-label="ניווט">
    <button type="button" data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>
      <span>היום</span>
    </button>
    <button type="button" data-act="tab" data-tab="ideas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-4 10.5c.8.8 1.2 1.6 1.3 2.5h5.4c.1-.9.5-1.7 1.3-2.5A6 6 0 0 0 12 3z"/></svg>
      <span>הצעות</span>
    </button>
    <button type="button" data-act="tab" data-tab="foods">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>רשימה</span>
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
